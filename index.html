<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- 1. Added touch-action=none prevent default mobile zooming/scrolling glitches -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Souls Survival</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- Eruda DevTools for Mobile Debugging -->
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>eruda.init();</script>
</head>
<body>
  <canvas id="game"></canvas>

  <!-- 2. Added Player HUD Container (Health & Shield Bars) -->
  <div id="hud" class="hud-container hidden">
    <div class="bar-container">
      <div id="hp-bar" class="bar hp-bar" style="width: 100%;"></div>
    </div>
    <div class="bar-container">
      <div id="shield-bar" class="bar shield-bar" style="width: 0%;"></div>
    </div>
    <div id="weapon-display" class="weapon-display">Sword (Common)</div>
  </div>

  <div id="hint">Drag left side to Move | ⤒ Jump | ⚔ Attack | ⚡ Dash</div>

  <button id="pause-btn">❚❚</button>

  <!-- Pause Screen -->
  <div id="pause-screen" class="overlay-screen hidden">
    <div class="menu-box">
      <h1>PAUSED</h1>
      <button id="resume-btn" class="menu-btn primary">Resume</button>
      <button id="quit-btn" class="menu-btn">Quit to Menu</button>
    </div>
  </div>

  <!-- Start Menu Screen -->
  <div id="menu-screen" class="overlay-screen">
    <div class="menu-box">
      <h1>SOULS SURVIVAL</h1>
      <p class="menu-sub">Fight through the stage and defeat the boss</p>
      <p class="menu-sub">Select Difficulty</p>
      <div class="diff-buttons">
        <button id="diff-normal" class="menu-btn diff-btn">Normal</button>
        <button id="diff-hard" class="menu-btn diff-btn selected">Hard</button>
      </div>
      <button id="start-btn" class="menu-btn primary">Start Game</button>
    </div>
  </div>

  <!-- Game Over Screen -->
  <div id="gameover-screen" class="overlay-screen hidden">
    <div class="menu-box">
      <h1 class="gameover-title">YOU DIED</h1>
      <p id="gameover-stats" class="menu-sub">You reached 0% of the stage</p>
      <!-- 3. Added type="button" to prevent form submission side effects -->
      <button id="respawn-btn" type="button" class="menu-btn primary">Respawn</button>
    </div>
  </div>

  <!-- Touch Controls Overlay -->
  <div id="controls">
    <div id="joystick-zone">
      <div id="joy-base" class="joy-base">
        <div id="joy-stick" class="joy-stick"></div>
      </div>
    </div>
    <div id="action-zone">
      <button id="dash-btn" type="button" class="btn">⚡</button>
      <button id="attack-btn" type="button" class="btn">⚔</button>
      <button id="jump-btn" type="button" class="btn big">⤒</button>
    </div>
  </div>

  <!-- ES Module Entry Point -->
  <script type="module" src="./src/main.js"></script>
</body>
</html>
