<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>Souls Survival</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>eruda.init();</script>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hint">◀ ▶ Move | ⤒ Jump | ⚔ Attack | ⚡ Dash</div>

  <button id="pause-btn">❚❚</button>

  <!-- Pause Screen -->
  <div id="pause-screen" class="overlay-screen hidden">
    <div class="menu-box">
      <h1>PAUSED</h1>
      <button id="resume-btn" class="menu-btn primary">Resume</button>
      <button id="quit-btn" class="menu-btn">Quit to Menu</button>
    </div>
  </div>

  <!-- Start Menu Screen -->
  <div id="menu-screen" class="overlay-screen">
    <div class="menu-box">
      <h1>SOULS SURVIVAL</h1>
      <p class="menu-sub">Fight through the stage and defeat the boss</p>
      <p class="menu-sub">Select Difficulty</p>
      <div class="diff-buttons">
        <button id="diff-normal" class="menu-btn diff-btn">Normal</button>
        <button id="diff-hard" class="menu-btn diff-btn selected">Hard</button>
      </div>
      <button id="start-btn" class="menu-btn primary">Start Game</button>
    </div>
  </div>

  <!-- Game Over Screen -->
  <div id="gameover-screen" class="overlay-screen hidden">
    <div class="menu-box">
      <h1 class="gameover-title">YOU DIED</h1>
      <p id="gameover-stats" class="menu-sub">You reached 0% of the stage</p>
      <button id="respawn-btn" class="menu-btn primary">Respawn</button>
    </div>
  </div>

  <!-- Win Screen -->
  <div id="win-screen" class="overlay-screen hidden">
    <div class="menu-box">
      <h1 class="win-title">STAGE CLEAR!</h1>
      <p class="menu-sub">You defeated the boss and reached the end.</p>
      <button id="win-restart-btn" class="menu-btn primary">Play Again</button>
    </div>
  </div>

  <!-- Touch Controls Overlay -->
  <div id="controls">
    <div id="dpad">
      <button id="dpad-left" class="dpad-btn">◀</button>
      <button id="dpad-right" class="dpad-btn">▶</button>
    </div>
    <div id="action-zone">
      <button id="dash-btn" class="btn">⚡</button>
      <button id="attack-btn" class="btn">⚔</button>
      <button id="jump-btn" class="btn big">⤒</button>
    </div>
  </div>

  <!-- ES Module Entry Point -->
  <script type="module" src="./src/main.js"></script>
</body>
</html>
